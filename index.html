<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061321" />
    <meta
      name="description"
      content="Apresentação de Web Services — histórico, conceitos, exemplos e código."
    />
    <title>Web Services | Apresentação</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="presenter" aria-label="Apresentação sobre Web Services">
      <div class="ambient ambient-a" aria-hidden="true"></div>
      <div class="ambient ambient-b" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span
          ><span>WEB SERVICES <small>/ APRESENTAÇÃO</small></span>
        </div>
        <div class="top-actions">
          <span id="slide-counter" class="slide-counter" aria-live="polite"
            >01 <span>/ 06</span></span
          >
          <button
            class="icon-btn"
            id="fullscreen-btn"
            title="Tela cheia (F)"
            aria-label="Ativar tela cheia"
            type="button"
          >
            <svg
              class="icon-expand"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"
              />
            </svg>
            <svg
              class="icon-collapse"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M3 9h4a2 2 0 0 0 2-2V3M21 9h-4a2 2 0 0 1-2-2V3M3 15h4a2 2 0 0 1 2 2v4M21 15h-4a2 2 0 0 0-2 2v4"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="Slide atual">
        <button
          id="prev-side"
          class="side-arrow side-arrow-left"
          type="button"
          aria-label="Slide anterior"
          title="Anterior (←)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <div class="slide-frame" id="slide-frame">
          <img
            id="slide-image"
            src="assets/slide-01.png"
            alt="Slide 1: Web Services — histórico, funcionamento e exemplos práticos"
            draggable="false"
            fetchpriority="high"
          />
        </div>
        <button
          id="next-side"
          class="side-arrow side-arrow-right"
          type="button"
          aria-label="Próximo slide"
          title="Próximo (→)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </section>

      <footer class="toolbar">
        <div class="keyboard-hint">
          <kbd>←</kbd><kbd>→</kbd> navegar <span class="sep">·</span>
          <kbd>F</kbd> tela cheia
        </div>
        <div class="navigation">
          <button id="prev-btn" class="nav-btn" type="button">
            <span aria-hidden="true">←</span> Anterior
          </button>
          <div class="dots" id="dots" aria-label="Selecionar slide"></div>
          <button id="next-btn" class="nav-btn nav-next" type="button">
            Próximo <span aria-hidden="true">→</span>
          </button>
        </div>
        <div class="progress-caption" id="progress-caption">Introdução</div>
      </footer>
      <div
        class="progress-track"
        role="progressbar"
        id="progress"
        aria-label="Progresso da apresentação"
        aria-valuemin="1"
        aria-valuemax="6"
        aria-valuenow="1"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
